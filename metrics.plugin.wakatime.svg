                                        <path fill-rule="evenodd" d="M2.75 2.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h2a.75.75 0 01.75.75v2.19l2.72-2.72a.75.75 0 01.53-.22h4.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25H2.75zM1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0113.25 12H9.06l-2.573 2.573A1.457 1.457 0 014 13.543V12H2.75A1.75 1.75 0 011 10.25v-7.5z"/>
                                    </svg>
                                    <div class="content">
                                        Commented on
                                        <span class="issue">#126883 [Bug]: hermes update exits 1 on macOS — sibling launchd restart kickstarts a stale plist and SIGUSR1s the osascript wrapper instead of the gateway</span>
                                    </div>
                                </div>
                                <div class="details">
                                    <div>opened by DavidMetcalfe in <span class="repo">NousResearch/hermes-agent</span></div>
                                    <div class="comment">
                                        Independent evidence report — 315-start restart storm on macOS after Desktop app update, self-recovered after the next update (2026-11-12/13)
Config: single default profile,
                                        <code>gui/501/ai.hermes.gateway</code>
                                        = JXA
                                        <code>osascript</code>
                                        wrapper →
                                        <code>hermes gateway run</code>
                                        chain,
                                        <code>ExitTimeOut=60</code>
                                        ,
                                        <code>restart_drain_timeout: 180</code>
                                        , drain-cap commits (
                                        <code>aa0289f307</code>
                                        , Sep 19) present beforehand.
Observed (from
                                        <code>gateway-exit-diag.log</code>
                                        , deduplicated):

Hermes Desktop app update (build 200280642) + repo pull
                                        <code>eaac327fac..761c879743</code>
                                        landed ~18:38 EST Nov 12 (incl.
                                        <code>0abaa01e5e</code>
                                        ,
                                        <code>16379afe89</code>
                                        ,
                                        <code>fb3ed58272</code>
                                        ).
Storm 18:47 EST → 02:37 EST: 315 distinct
                                        <code>gateway.start</code>
                                        events in 7.81 h (40.4/h), start→start interval mean 89.5 s / median 74.6 s (p10 62 s, p90 142 s).
158 departures ran exit handlers (156 plain
                                        <code>asyncio.run.returned</code>
                                        , 2
                                        <code>SystemExit(75)</code>
                                        ); 157 departures recorded no exit-handler event at all — mechanism unattributed (consistent with SIGKILL, not proven; no OS/supervisor signal record available).
Second update pull
                                        <code>1c5a7251dc..ceab553c9e</code>
                                        at ~02:05 EST (incl.
                                        <code>c5dc1971f3</code>
                                        app-bundle launcher placement/integrity,
                                        <code>cd2500abad</code>
                                        ticket-helper bytecode vs bundle signature). Last death 02:37 EST; first start thereafter has not restarted since (currently
                                        <code>903aaee3f9</code>
                                        ,
                                        <code>--external-supervisor</code>
                                        , stable).
An hourly lifecycle detector replay of the window classifies STORM (thresholds ≥8 starts/h or ≥4/15 min), current window CALM.

Hypothesis (fits defect 1+2 above; not directly proven): stale unconditional-
                                        <code>KeepAlive</code>
                                        plist + the wrapper-vs-gateway signal confusion during the repeated update/restart passes → an orphaned gateway holding the socket while launchd respawned a new one, with the pair mutually evicted each cycle. The recovery's temporal association with
                                        <code>c5dc1971f3</code>
                                        /
                                        <code>cd2500abad</code>
                                        is strong but the SIGKILL sender was never caught in a record, so root cause is filed as unresolved with this incident attached as evidence.
Sanitized: counts, timestamps, commit hashes, config values only — no logs, tokens, or transcripts attached.
                                    </div>
